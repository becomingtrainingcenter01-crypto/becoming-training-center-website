<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061d2c">
<title>Confirmation de réservation | Becoming Training Center</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
.confirmation-page{min-height:100vh;background:linear-gradient(180deg,#061d2c 0,#0b3147 46%,#f5fafb 46%);color:#102d3e}.confirmation-shell{max-width:760px;margin:0 auto;padding:110px 22px 70px}.confirmation-card{padding:clamp(30px,6vw,58px);background:#fff;border:1px solid rgba(7,62,104,.13);box-shadow:0 28px 80px rgba(2,22,35,.22);text-align:center}.confirmation-mark{display:grid;place-items:center;width:74px;height:74px;margin:0 auto 24px;border-radius:50%;background:#edf5f7;color:#078dc2;font-size:2rem;font-weight:800}.confirmation-card h1{margin:0 0 18px;font:700 clamp(2.4rem,7vw,4.7rem)/1 "Playfair Display",serif;color:#061d2c}.confirmation-card p{max-width:590px;margin:0 auto;color:#526b79;font-size:1.05rem;line-height:1.7}.confirmation-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}.confirmation-card[data-state="success"] .confirmation-mark{background:#edf9e8;color:#20562b}.confirmation-card[data-state="error"] .confirmation-mark{background:#fff0ef;color:#8a251d}.confirmation-card[data-state="pending"] .confirmation-mark{background:#fff8e8;color:#8a651b}
</style>
</head>
<body class="confirmation-page">
<main class="confirmation-shell">
<section class="confirmation-card" data-booking-success data-state="loading">
<div class="confirmation-mark" aria-hidden="true">✓</div>
<p class="kicker">Réservation</p>
<h1 data-payment-status>Vérification du paiement…</h1>
<p data-payment-detail>Stripe nous transmet la confirmation sécurisée.</p>
<div class="confirmation-actions">
<a class="button button--primary" href="index.html" data-home-link>Retour à l’accueil</a>
<a class="button button--secondary" href="booking.html" data-booking-link>Faire une autre réservation</a>
</div>
</section>
</main>
<script src="assets/js/booking-success.js" defer></script>
</body>
</html>
