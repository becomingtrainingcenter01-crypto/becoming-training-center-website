<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061d2c"><title>Membership confirmed | Becoming VIP Club</title><link rel="stylesheet" href="../assets/css/styles.css"><style>body{background:#f5fafb}.success{min-height:75vh;display:grid;place-items:center;padding:48px 20px}.card{max-width:760px;padding:clamp(28px,6vw,58px);background:#fff;border:1px solid rgba(7,62,104,.14);box-shadow:0 22px 60px rgba(7,40,61,.08);text-align:center}.card h1{font:700 clamp(2.4rem,7vw,4.8rem)/1 "Playfair Display",serif;color:#061d2c}.card p{color:#526b79;font-size:1.08rem}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:28px}</style></head><body><main class="success"><section class="card"><span class="kicker">Becoming VIP Club</span><h1>Welcome to the club.</h1><p>Your payment was received and your monthly membership is being activated. Stripe will send a receipt to your email address.</p><p>You can manage your card, review invoices, or cancel your membership through the member billing portal.</p><div class="actions"><a class="button button--primary" href="vip.html">Return to VIP Club</a><button class="button button--dark" type="button" id="portal">Manage my membership</button></div><p id="status" role="status"></p></section></main><script>document.getElementById('portal').addEventListener('click',async()=>{const b=document.getElementById('portal');const s=document.getElementById('status');b.disabled=true;s.textContent='Opening Stripe portal…';try{const r=await fetch('/api/vip-portal-link',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.portal_url)throw new Error();location.assign(d.portal_url)}catch{s.textContent='The portal is not available right now.';b.disabled=false}});</script></body></html>
