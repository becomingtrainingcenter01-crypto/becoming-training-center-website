<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061d2c"><title>Forgot password | Becoming Training Center</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../favicon.png" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/styles.css"><style>.account-page{background:linear-gradient(180deg,#f4fafb,#fff);min-height:100vh}.account-hero{padding:72px 0 38px;background:#061d2c;color:#fff}.account-hero h1{max-width:760px;margin:10px 0;font:700 clamp(2.5rem,7vw,5rem)/1 "Playfair Display",serif}.account-shell{max-width:720px;margin:0 auto}.account-card{background:#fff;border:1px solid rgba(7,62,104,.14);box-shadow:0 22px 60px rgba(7,40,61,.09);padding:clamp(22px,5vw,48px)}.account-form{display:grid;gap:18px}.account-form label span{display:block;margin-bottom:8px;font-weight:800}.account-form input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid rgba(7,62,104,.22);border-radius:8px}.account-status{margin-top:18px}.account-status.is-error{color:#8a251d}.account-status.is-success{color:#20562b}.account-note{color:#607785;font-size:.94rem}</style></head><body class="account-page" data-password-page="forgot"><header class="site-header" data-header><div class="container header-shell"><a class="brand" href="index.html"><img src="../assets/images/logo.png" alt="Becoming Training Center"></a><div class="header-actions"><a class="lang-switch" href="../forgot-password.html">FR</a><a class="button button--primary" href="account.html">Sign in</a></div></div></header><main><section class="account-hero"><div class="container account-shell"><span class="kicker kicker--light">Account security</span><h1>Forgot your password?</h1><p>Enter the email for your VIP account. We will send a secure link valid for 30 minutes.</p></div></section><section class="section"><div class="container account-shell"><div class="account-card"><form class="account-form" data-forgot-form><label><span>Email address</span><input name="email" type="email" autocomplete="email" required maxlength="254"></label><button class="button button--primary button--large" type="submit">Send reset link</button><p class="account-note">To protect your privacy, the confirmation message is the same whether an account exists or not.</p></form><p class="account-status" data-password-status role="status" aria-live="polite"></p><p><a href="account.html">Back to sign in</a></p></div></div></section></main><script src="../assets/js/site.js" defer></script><script src="../assets/js/password-reset.js" defer></script></body></html>
